# The bencode guide, served at baskingspot.dev/bencode/. The theme and the
# site build come from baskingspot-docs; the router in baskingspot/site serves
# /bencode/...
base_url = "https://baskingspot.dev/bencode"
theme = "baskingspot"
title = "bencode"
description = "Bencode in Zig: an incremental reader, a value tree, and a writer."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/bencode"
api = true
third_party = false
